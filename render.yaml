services:
  # REST API — the Express app. A real, always-running Node process.
  - type: web
    name: connecti-api
    runtime: node
    plan: free
    rootDir: .
    # --include=dev: NODE_ENV=production below makes npm default to
    # omitting devDependencies on install, which would silently drop
    # typescript itself and every @types/* package the build needs.
    buildCommand: npm install --include=dev && npm run build -w @connecti/shared && npm run build -w @connecti/api
    startCommand: npm run start -w @connecti/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: INTERNAL_SOCKET_SECRET
        generateValue: true
      # The frontend is hosted on Vercel, not Render (see connecti-web
      # note below) — set both to that Vercel deployment's real URL.
      - key: CORS_ORIGIN
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SOCKET_INTERNAL_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  # Socket.IO server — a second, separate Node process. Long-running and
  # stateful (in-memory presence map), which is exactly why it can't be a
  # serverless function and needs its own always-on service.
  - type: web
    name: connecti-socket
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npm run build -w @connecti/shared && npm run build -w @connecti/api
    startCommand: npm run start:socket -w @connecti/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET_KEY
        sync: false # must match connecti-api's value exactly
      - key: INTERNAL_SOCKET_SECRET
        sync: false # must match connecti-api's value exactly
      - key: CORS_ORIGIN
        sync: false # the Vercel frontend's URL

# The frontend is deployed on Vercel, not here — Render's own static-site
# hosting (a `connecti-web` service, previously defined in this file) isn't
# used. Vercel needs its own VITE_BASE_URL/VITE_SOCKET_URL/
# VITE_GOOGLE_CLIENT_ID env vars set in its project settings, pointing at
# connecti-api's and connecti-socket's Render URLs above.
