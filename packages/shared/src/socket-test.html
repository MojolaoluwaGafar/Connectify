<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO Test</title>
  </head>

  <body>
    <h1>Connecti Socket.IO Test</h1>

    <div>
      <label>
        JWT Token:
        <input
          id="token"
          type="text"
          placeholder="Paste JWT here"
        />
      </label>

      <button id="connect">Connect</button>
    </div>

    <br />

    <div>
      <label>
        Conversation ID:
        <input
          id="conversationId"
          type="text"
          placeholder="userId_userId"
        />
      </label>

      <button id="join">Join Conversation</button>
    </div>

    <br />

    <div>
      <label>
        Message:
        <input
          id="message"
          type="text"
          placeholder="Type a message"
        />
      </label>

      <button id="send">Send Message</button>
    </div>

    <br />

    <button id="read">Mark Read</button>

    <h2>Socket Log</h2>

    <pre id="log"></pre>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script>
      let socket = null;

      let typingTimer = null;
      let isTyping = false;

      const tokenInput = document.getElementById("token");
      const conversationInput =
        document.getElementById("conversationId");
      const messageInput =
        document.getElementById("message");
      const log = document.getElementById("log");

      const connectButton =
        document.getElementById("connect");
      const joinButton =
        document.getElementById("join");
      const sendButton =
        document.getElementById("send");
      const readButton =
        document.getElementById("read");

      function addLog(message) {
        log.textContent += message + "\n";
      }

      function isSocketReady() {
        if (!socket || !socket.connected) {
          addLog("❌ Connect first");
          return false;
        }

        return true;
      }

      connectButton.addEventListener("click", () => {
        const token = tokenInput.value.trim();

        if (!token) {
          addLog("❌ JWT token is required");
          return;
        }

        if (socket?.connected) {
          addLog("⚠️ Socket is already connected");
          return;
        }

        socket = io("http://localhost:3002", {
          transports: ["websocket"],
          auth: {
            token,
          },
        });

        socket.on("connect", () => {
          addLog("✅ Connected");
          addLog("Socket ID: " + socket.id);
        });

        socket.on("online_users", (users) => {
          addLog(
            "👥 Online users: " +
              JSON.stringify(users),
          );
        });

        socket.on("user_online", (userId) => {
          addLog("🟢 User online: " + userId);
        });

        socket.on("user_offline", (userId) => {
          addLog("🔴 User offline: " + userId);
        });

        socket.on("conversation_joined", (data) => {
          addLog(
            "✅ Joined conversation: " +
              JSON.stringify(data),
          );
        });

        socket.on("join_conversation_error", (data) => {
          addLog(
            "❌ Join error: " +
              JSON.stringify(data),
          );
        });

        socket.on("receive_message", (message) => {
          addLog("💬 MESSAGE RECEIVED:");

          addLog(
            JSON.stringify(message, null, 2),
          );
        });

        socket.on("conversation_read", (data) => {
          addLog(
            "👀 Conversation read: " +
              JSON.stringify(data),
          );
        });

        socket.on("send_message_error", (data) => {
          addLog(
            "❌ Send error: " +
              JSON.stringify(data),
          );
        });

        socket.on("user_typing", (data) => {
          addLog(
            "⌨️ User is typing: " +
              JSON.stringify(data),
          );
        });

        socket.on("user_stop_typing", (data) => {
          addLog(
            "🛑 User stopped typing: " +
              JSON.stringify(data),
          );
        });

        socket.on("connect_error", (error) => {
          addLog(
            "❌ Connection error: " +
              error.message,
          );
        });

        socket.on("disconnect", (reason) => {
          addLog(
            "🔌 Disconnected: " +
              reason,
          );

          clearTimeout(typingTimer);
          isTyping = false;
        });
      });

      joinButton.addEventListener("click", () => {
        if (!isSocketReady()) return;

        const conversationId =
          conversationInput.value.trim();

        if (!conversationId) {
          addLog(
            "❌ Conversation ID is required",
          );

          return;
        }

        addLog(
          "➡️ Joining: " +
            conversationId,
        );

        socket.emit(
          "join_conversation",
          conversationId,
        );
      });

      messageInput.addEventListener("input", () => {
        if (!isSocketReady()) return;

        const conversationId =
          conversationInput.value.trim();

        if (!conversationId) return;

        /*
          Only send typing_start once.

          If the user continues typing,
          we don't keep sending the event.
        */
        if (!isTyping) {
          socket.emit("typing_start", {
            conversationId,
          });

          isTyping = true;

          addLog("➡️ Started typing");
        }

        /*
          Reset the timer every time
          the user types another character.
        */
        clearTimeout(typingTimer);

        typingTimer = setTimeout(() => {
          socket.emit("typing_stop", {
            conversationId,
          });

          isTyping = false;

          addLog("➡️ Stopped typing");
        }, 1500);
      });

      sendButton.addEventListener("click", () => {
        if (!isSocketReady()) return;

        const conversationId =
          conversationInput.value.trim();

        const content =
          messageInput.value.trim();

        addLog(
          "DEBUG → conversationId: " +
            conversationId +
            " | content: " +
            content,
        );

        if (!conversationId) {
          addLog(
            "❌ Conversation ID is required",
          );

          return;
        }

        if (!content) {
          addLog(
            "❌ Message is required",
          );

          return;
        }

        /*
          Stop the typing state immediately
          when the user sends the message.
        */
        clearTimeout(typingTimer);

        if (isTyping) {
          socket.emit("typing_stop", {
            conversationId,
          });

          isTyping = false;

          addLog("➡️ Stopped typing");
        }

        socket.emit("send_message", {
          conversationId,
          content,
        });

        addLog(
          "➡️ Sending: " +
            content,
        );

        messageInput.value = "";
      });

      readButton.addEventListener("click", () => {
        if (!isSocketReady()) return;

        const conversationId =
          conversationInput.value.trim();

        if (!conversationId) {
          addLog(
            "❌ Conversation ID is required",
          );

          return;
        }

        socket.emit("mark_read", {
          conversationId,
        });

        addLog(
          "➡️ Marking conversation as read",
        );
      });
    </script>
  </body>
</html>
